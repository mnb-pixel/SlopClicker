<!doctype html>
<!-- lang="de": die Oberfläche startet auf Deutsch (siehe useGameStore, Default 'de').
     Beim Umschalten im Kopfzeilen-Menü wird das Attribut zur Laufzeit nachgezogen. -->
<html lang="de" class="dark">
  <head>
    <meta charset="UTF-8" />

    <!-- Termly Consent-Banner + Auto Blocker (autoBlock=on in der URL). Muss laut Termly
         der ALLERERSTE <script>-Tag der Seite sein - auch vor dem AdSense-Snippet weiter
         unten -, damit der Auto Blocker dessen Cookie-setzende Skripte erkennen und bis zur
         Einwilligung blockieren kann, statt dass AdSense schon vor der Zustimmung feuert. -->
    <script src="https://app.termly.io/resource-blocker/4810446e-db26-4a1e-a96a-1bbdefde2c01?autoBlock=on"></script>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Token Furnace – Baue dein KI-Startup zur Milliardenbewertung auf, ganz ohne Produkt. Satirischer Idle Clicker über den AI-Hype." />

    <!-- Statischer Titel für Crawler und Social-Bots, die kein JavaScript ausführen: die
         App überschreibt document.title nach dem Mount ohnehin mit dem Live-Spielstand
         ("$1,2 Mio. - tokenkamin"), aber genau dieser Wert hier landet im Suchindex und
         als Fallback in Link-Vorschauen - "$0 - tokenkamin" war dafür unbrauchbar. -->
    <title>Token Furnace – Der AI-Bubble Idle Clicker</title>

    <!-- Google AdSense: Inhaberschaftsbestätigung + späteres Ausliefern von Anzeigen.
         Lädt nur die Bibliothek, fragt noch keine personalisierten Anzeigen an. Der Termly
         Auto Blocker oben soll dieses Skript erkennen und bis zur Cookie-Einwilligung
         blockieren. Beschrieben ist das in der Datenschutzerklärung, Ziffer 4
         (Einwilligungsverwaltung) und Ziffer 5 (Werbung) in legal.content.js - wird die
         client-ID hier geändert oder das Netzwerk getauscht, muss Ziffer 5 mitgezogen werden.
         Vor dem Livegang bitte einmal praktisch prüfen, dass ohne Einwilligung tatsächlich
         KEIN Request an pagead2.googlesyndication.com rausgeht (DevTools > Network). -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6020764817262332"
     crossorigin="anonymous"></script>

    <!-- Social-Share-Vorschau (Open Graph / Twitter Card): das Pitch-Deck-Feature verschickt
         aktiv window.location.href über navigator.share() (siehe PitchDeckModal.jsx) - ohne
         diese Tags zeigt jeder geteilte Link keine Bildvorschau/Titel, was genau das virale
         Feature entwertet. %VITE_SITE_URL% wird von Vite aus der Env-Variable VITE_SITE_URL
         interpoliert (siehe .env) - MUSS auf die echte Produktions-Domain gesetzt werden,
         sonst zeigt die Vorschau eine Platzhalter-URL an.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Token Furnace" />
    <meta property="og:title" content="Token Furnace – Der AI-Bubble Idle Clicker" />
    <meta property="og:description" content="Baue dein KI-Startup zur Milliardenbewertung auf, ganz ohne Produkt. Satirischer Idle Clicker über den AI-Hype." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/singularity_prestige_meme.jpg" />
    <meta property="og:image:width" content="1376" />
    <meta property="og:image:height" content="768" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Token Furnace – Der AI-Bubble Idle Clicker" />
    <meta name="twitter:description" content="Baue dein KI-Startup zur Milliardenbewertung auf, ganz ohne Produkt. Satirischer Idle Clicker über den AI-Hype." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/singularity_prestige_meme.jpg" />
  </head>
  <body class="bg-slate-950 text-slate-100 overflow-x-hidden selection:bg-cyan-500 selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
