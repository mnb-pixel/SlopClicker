<!doctype html>
<!-- lang="de": die Oberfläche startet auf Deutsch (siehe useGameStore, Default 'de').
     Beim Umschalten im Kopfzeilen-Menü wird das Attribut zur Laufzeit nachgezogen. -->
<html lang="de" class="dark">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>" />
    <!-- Ohne maximum-scale/user-scalable=no: die vorige Fassung blockierte Pinch-Zoom
         vollständig, das verletzt WCAG 2.1 Kriterium 1.4.4 (Resize Text) - Menschen mit
         Sehbehinderung MÜSSEN reinzoomen können, auch in einem Spiel. touch-action:
         manipulation in index.css übernimmt den eigentlichen Zweck der alten Einstellung
         (kein 300ms-Tap-Delay / kein versehentlicher Doppeltipp-Zoom beim schnellen
         Klicken), ohne Pinch-Zoom mit zu blockieren.
         viewport-fit=cover: ohne dieses Flag liefert WebKit für ALLE env(safe-area-inset-*)
         in index.css konstant 0 zurück (auch mit ios.contentInset:'never' in
         capacitor.config.ts) - Header/Tab-Leiste/Werbe-Anker rutschen dann unter die
         Notch/Dynamic Island bzw. den Home-Indicator statt sie zu respektieren. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Token Furnace – Baue dein KI-Startup zur Milliardenbewertung auf, ganz ohne Produkt. Satirischer Idle Clicker über den AI-Hype." />

    <!-- Statischer Titel für Crawler und Social-Bots, die kein JavaScript ausführen: die
         App überschreibt document.title nach dem Mount ohnehin mit dem Live-Spielstand
         ("$1,2 Mio. - tokenkamin"), aber genau dieser Wert hier landet im Suchindex und
         als Fallback in Link-Vorschauen - "$0 - tokenkamin" war dafür unbrauchbar.
         Titel, Description und OG-Tags werden für die Content-Seiten beim Build pro Seite
         ersetzt (scripts/prerender.mjs) - hier stehen die Defaults für das Spiel (/play). -->
    <title>Token Furnace – Der AI-Bubble Idle Clicker</title>

    <!-- AdSense-Site-Verifizierung per Meta-Tag: consent-frei und ohne Script, damit Google
         die Seite auch dann dem Konto zuordnen kann, wenn adsbygoogle.js (unten) noch gar
         nicht geladen wird. Gehört zum selben Publisher-Konto wie public/ads.txt. -->
    <meta name="google-adsense-account" content="ca-pub-6020764817262332" />

    <!-- Kein statisches AdSense-Script hier: adsbygoogle.js wird erst zur Laufzeit, nach
         erteiltem Werbe-Cookie-Consent und nur wenn VITE_ADSENSE_CLIENT_ID gesetzt ist,
         dynamisch nachgeladen (siehe monetization/adsensePlacement.js, genutzt von
         AdBanner.jsx und adsenseAdBridge.js) - vor der AdSense-Freischaltung bleibt das
         also ein No-Op. Klaro (monetization/klaroLoader.js) ist unabhängig davon schon
         initialisiert, damit die Cookie-Consent-Basis steht. -->

    <!-- crazygames-only:start -->
    <!-- CrazyGames SDK v3: bewusst als blockierendes klassisches <script> (kein async/defer,
         kein type="module") VOR dem App-Bundle unten - so garantiert die Skript-Reihenfolge,
         dass window.CrazyGames.SDK schon existiert, wenn main.jsx läuft (deferred module
         scripts laufen immer erst nach allen blockierenden Scripts, unabhängig von der
         Position im Dokument). Siehe src/monetization/crazyGamesSdk.js für Init/Lifecycle
         und crazyGamesAdBridge.js für die Rewarded-Ad-Anbindung. Nur enthalten für
         --mode crazygames, s. vite.config.js - in den anderen Builds bliebe
         window.CrazyGames sonst undefiniert und jeder Aufruf müsste das separat abfangen.
         Docs: https://docs.crazygames.com/sdk/html5-v2/intro/ -->
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
    <!-- crazygames-only:end -->

    <!-- Social-Share-Vorschau (Open Graph / Twitter Card): das Pitch-Deck-Feature verschickt
         aktiv window.location.href über navigator.share() (siehe PitchDeckModal.jsx) - ohne
         diese Tags zeigt jeder geteilte Link keine Bildvorschau/Titel, was genau das virale
         Feature entwertet. %VITE_SITE_URL% wird von Vite aus der Env-Variable VITE_SITE_URL
         interpoliert (siehe .env) - MUSS auf die echte Produktions-Domain gesetzt werden,
         sonst zeigt die Vorschau eine Platzhalter-URL an.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Token Furnace" />
    <meta property="og:title" content="Token Furnace – Der AI-Bubble Idle Clicker" />
    <meta property="og:description" content="Baue dein KI-Startup zur Milliardenbewertung auf, ganz ohne Produkt. Satirischer Idle Clicker über den AI-Hype." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/vc_report_share.png" />
    <meta property="og:image:width" content="1080" />
    <meta property="og:image:height" content="2170" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Token Furnace – Der AI-Bubble Idle Clicker" />
    <meta name="twitter:description" content="Baue dein KI-Startup zur Milliardenbewertung auf, ganz ohne Produkt. Satirischer Idle Clicker über den AI-Hype." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/vc_report_share.png" />
    <!-- Wird von scripts/prerender.mjs pro Content-Seite durch <link rel="canonical"> ersetzt. -->
    <!--site-head-->
  </head>
  <body class="bg-slate-950 text-slate-100 overflow-x-hidden selection:bg-cyan-500 selection:text-black">
    <!-- Web-Build: scripts/prerender.mjs ersetzt den Marker durch das fertig gerenderte HTML
         der jeweiligen Content-Seite (src/site/), main.jsx hydratisiert dann nur noch. So
         sieht auch ein Crawler/Review ohne JavaScript den kompletten Seiteninhalt - aus
         derselben Quelle wie die Live-Seite, kein separat gepflegter Fallback-Text mehr.
         Für das Spiel (/play, CrazyGames, nativ) bleibt der Container leer, bis React mountet. -->
    <div id="root"><!--site-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
